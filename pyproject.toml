[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "call-audit-pipeline"
version = "0.1.0"
description = "Async, multi-core audio transcription and PII-redaction pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "faster-whisper>=1.0",
    "soundfile>=0.12",
    "numpy>=1.26",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",     # needed for FastAPI's TestClient / websocket test helpers
    "py-spy>=0.3",
    "scalene>=1.5",
]

[tool.setuptools.packages.find]
include = ["app*"]